  <path d="M225 198C225 176 243 157 267 157H444L570 277V484C570 508 552 525 528 525H308C279 525 259 504 259 477V436H290C302 436 311 427 311 415C311 403 302 394 290 394H225V385C225 372 236 361 250 361H315C341 361 358 341 358 311C358 282 339 263 313 263H228C226 243 225 220 225 198Z" fill="url(#documentGradient)"/>

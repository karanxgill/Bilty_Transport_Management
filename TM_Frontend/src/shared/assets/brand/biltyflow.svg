<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="576" viewBox="0 0 2048 576" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">BiltyFlow</title>
  <desc id="desc">BiltyFlow logo: a violet digital document with a checkmark and the BiltyFlow wordmark.</desc>

      <stop offset="1" stop-color="#5423BD"/>
    </linearGradient>
    <linearGradient id="flowGradient" x1="1280" y1="260" x2="1910" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A16BFF"/>
